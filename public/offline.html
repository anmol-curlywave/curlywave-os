<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Curlywave OS — offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: "Segoe UI", system-ui, sans-serif; background: #f6f6fb; color: #1b1a2e; padding: 16px; }
  @media (prefers-color-scheme: dark) { body { background: #111019; color: #ecebf5; } .card { background: #1a1926 !important; border-color: #2f2d44 !important; } }
  .card { background: #fff; border: 1px solid #e4e2ef; border-radius: 14px; padding: 28px; max-width: 380px; text-align: center; }
  button { background: #5b3df5; color: #fff; border: 0; border-radius: 9px; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <h2>You're offline</h2>
    <p>Curlywave OS needs an internet connection to load your clients and tasks.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
