name: Import source bundle
on:
  push:
    branches: [main]
    paths: ["bootstrap/**"]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and verify
        id: unpack
        if: ${{ hashFiles('bootstrap/bundle.b64') != '' && hashFiles('bootstrap/bundle.sha256') != '' }}
        run: |
          tr -d ' \r\n' < bootstrap/bundle.b64 | base64 -d > /tmp/bundle.tgz
          echo "$(cat bootstrap/bundle.sha256)  /tmp/bundle.tgz" | sha256sum -c -
          tar -xzf /tmp/bundle.tgz -C .
          git rm -r --quiet bootstrap
          git config user.name "curlywave-bot"
          git config user.email "curlywave-bot@users.noreply.github.com"
          git add -A
          git commit -m "Import Curlywave OS source"
          git push
          echo "done=true" >> "$GITHUB_OUTPUT"
      - name: Start deploy and desktop builds
        if: steps.unpack.outputs.done == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml --ref main
          gh workflow run desktop.yml --ref main
